<title>Esfera azul do Brasil com faixa 3D</title>
<style>
/* --r = raio da esfera (pode mudar) | --n = nº de gomos (deixe em 48: a textura foi calculada para 48) */
:root{--r:min(160px,34vmin);--n:48;--t:10s;--w:calc(2*var(--r)*tan(180deg/var(--n)));
/* Textura da esfera azul: faixa, lema e estrelas (SVG embutido) */
--ceu:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-13.09 -100 641.41 200'><defs><path id='e' d='M0-1 .2245-.309H.951L.3633.118.588.809 0 .382-.588.809-.3633.118-.951-.309h.7265z' fill='%23fff'/><path id='b' d='M-104.72 25.17C-69.81 8.94 -34.91 -10.01 0 -22.77C34.91 -35.52 69.81 -41.59 104.72 -38.12C139.63 -34.65 174.53 -21.76 209.44 -5.54C244.35 10.69 279.25 29.64 314.16 42.39C349.07 55.15 383.97 61.22 418.88 57.75C453.79 54.27 488.69 41.39 523.6 25.17C558.51 8.94 593.41 -10.01 628.32 -22.77C663.23 -35.52 698.13 -41.59 733.04 -38.12' stroke='%23fff' stroke-width='16' fill='none'/><g id='c'><use href='%23e' transform='translate(188.7 72.32)scale(5.45)'/><use href='%23e' transform='translate(235.19 36.11)scale(4.64)'/><use href='%23e' transform='translate(158.05 15.13)scale(5.47)'/><use href='%23e' transform='translate(61.54 -15.89)scale(5.46)'/><use href='%23e' transform='translate(77.13 25.38)scale(5.44)'/><use href='%23e' transform='translate(189.37 -30.53)scale(4.87)'/><use href='%23e' transform='translate(184.03 -2.86)scale(3.82)'/><use href='%23e' transform='translate(55 34.34)scale(3.65)'/><use href='%23e' transform='translate(237.29 44.69)scale(2.94)'/><use href='%23e' transform='translate(101.96 34.32)scale(3.64)'/><use href='%23e' transform='translate(168.91 25.37)scale(3.65)'/><use href='%23e' transform='translate(148.85 25.35)scale(3.69)'/><use href='%23e' transform='translate(90.45 19.48)scale(2.33)'/><use href='%23e' transform='translate(233.2 52.49)scale(3.67)'/><use href='%23e' transform='translate(212.5 55.19)scale(3.08)'/><use href='%23e' transform='translate(222.2 55.18)scale(2.82)'/><use href='%23e' transform='translate(255.5 35.55)scale(2.75)'/><use href='%23e' transform='translate(211.96 66.06)scale(3.53)'/><use href='%23e' transform='translate(212.27 75.04)scale(3.38)'/><use href='%23e' transform='translate(195.58 55.26)scale(2.7)'/><use href='%23e' transform='translate(180.69 55.26)scale(2.72)'/><use href='%23e' transform='translate(159.29 77.49)scale(2.35)'/><use href='%23e' transform='translate(120.27 5.36)scale(5.44)'/></g></defs><rect x='-13.09' y='-100' width='641.41' height='200' fill='%23002776'/><use href='%23c'/><use href='%23c' x='314.16'/><use href='%23e' transform='translate(120.27 55.35)scale(5.45)'/><use href='%23e' transform='translate(159.67 45.8)scale(4.75)'/><use href='%23e' transform='translate(97.09 45.27)scale(3.67)'/><use href='%23e' transform='translate(156.35 34.18)scale(2.71)'/></svg>");}

body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1a12;overflow:hidden}

/* A esfera: círculo que recorta o modelo 3D */
.esfera{position:relative;width:calc(var(--r)*2);aspect-ratio:1;border-radius:50%;
overflow:hidden;background:#002776;box-shadow:0 30px 50px -15px rgba(0,0,0,.55)}

/* O eixo: grupo 3D que gira em torno do próprio eixo vertical (Y) */
.eixo{position:absolute;inset:0;transform-style:preserve-3d;animation:girar var(--t,14s) linear infinite}

/* Cada gomo: uma fatia do céu, posicionada em volta do eixo */
.eixo i{position:absolute;top:0;height:100%;left:50%;
width:calc(var(--w) + 1px);margin-left:calc((var(--w) + 1px)/-2);
background:var(--ceu) calc(-1*(var(--i) + .5)*var(--w) + .5px) 0/calc((var(--n) + 1)*var(--w)) 100% no-repeat;
backface-visibility:hidden;
transform:rotateY(calc(var(--i)*360deg/var(--n))) translateZ(var(--r))}

/* Luz e sombra que dão o volume de esfera */
.esfera::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.5),rgba(255,255,255,.12) 22%,transparent 42%),
radial-gradient(circle at 50% 50%,transparent 52%,rgba(0,0,0,.28) 78%,rgba(0,0,0,.7) 100%)}

@media (prefers-reduced-motion:reduce){.eixo{animation-play-state:paused}}
@keyframes girar{from{transform:rotateY(-90deg)}to{transform:rotateY(270deg)}}

/* ====================== FAIXA 3D (Ordem e Progresso) ======================
   A faixa e um anel inclinado feito de 144 paineis de 2,5 graus, com parede externa (lema),
   parede interna, bordas e pontas. Parte do anel fica ATRAS da esfera (camada .fundo) e parte
   NA FRENTE (camada .frente), por isso a esfera "atravessa" a faixa de verdade.
   Variaveis animadas (animacao "ciclo", de 10s, em .fita e .sombra; mude --fita para acelerar/desacelerar):
   --a / --b  angulos (graus) das duas pontas da faixa (atras / frente)   --s  posicao do lema ao longo da volta
   A inclinacao do anel (rotX, rotZ, deslocamento vertical) vem da animacao "pose" (so transform).       */
@property --a{syntax:'<number>';inherits:true;initial-value:-125}
@property --b{syntax:'<number>';inherits:true;initial-value:125}
@property --s{syntax:'<number>';inherits:true;initial-value:-57}
:root{--fita:10s;   /* duracao de um ciclo da faixa (a esfera usa --t) */
--ro:calc(var(--r)*1.125);--e:calc(var(--r)*0.04);--ri:calc(var(--ro) - var(--e));--h:calc(var(--r)*0.3);
--pw:calc(2*var(--ro)*tan(1.25deg));--pwi:calc(2*var(--ri)*tan(1.25deg));
--ppd:calc(2*pi*var(--ro)/360);
--txt:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1130.97 48.00' preserveAspectRatio='none'><text x='1.5' y='36.03' font-family='Arial,Helvetica,sans-serif' font-weight='700' font-size='33.60' fill='%23009c3b' stroke='%23009c3b' stroke-width='1' stroke-linejoin='round' textLength='389.56' lengthAdjust='spacingAndGlyphs'>ORDEM E PROGRESSO</text></svg>");}

.cena{position:relative;width:calc(2*var(--r));aspect-ratio:1}
.fita,.sombra{animation:ciclo var(--fita) linear infinite}
.anel{--Ct:calc(-126.25 + round(up,calc(var(--a) + 125),2.5));      /* ponta de tras (snap na grade dos paineis) */
--Cl:calc(-123.75 + round(down,calc(var(--b) + 125),2.5))}  /* ponta da frente */
.fita,.sombra{position:absolute;inset:0;pointer-events:none}
.fundo{z-index:0}.esfera{z-index:1}.frente{z-index:2}

/* o anel: mesmo referencial da esfera, inclinado pela animacao "pose" */
.anel{position:absolute;inset:0;transform-style:preserve-3d;animation:pose var(--fita) linear infinite}
.anel i,.anel b{position:absolute;left:50%;top:50%;height:var(--h);margin-top:calc(var(--h)/-2);
transform-style:preserve-3d;backface-visibility:hidden}

/* visibilidade: o painel so aparece se o seu angulo cai dentro de [--a, --b] (com a volta de 360 graus) */
.anel i{opacity:max(
calc(clamp(0,(var(--p) - var(--a))*1000,1)*clamp(0,(var(--b) - var(--p))*1000,1)),
calc(clamp(0,(var(--p) + 360 - var(--a))*1000,1)*clamp(0,(var(--b) - var(--p) - 360)*1000,1)))}

/* parede externa (branca, com o lema impresso; o lema desliza com --s) */
.anel .o{width:calc(var(--pw) + 3px);margin-left:calc((var(--pw) + 3px)/-2);
transform:rotateY(calc(var(--p)*1deg)) translateZ(var(--ro));
background:linear-gradient(rgba(12,22,52,var(--k,0)),rgba(12,22,52,var(--k,0))),
var(--txt) calc((var(--pw) + 3px)/2 - (var(--p) - var(--s))*var(--ppd)) 0/calc(2*pi*var(--ro)) 100% repeat-x,#f4f4f1}
/* parede interna (cinza claro) - fica de frente para a camera no lado de tras do anel */
.anel .n{width:calc(var(--pwi) + 3px);margin-left:calc((var(--pwi) + 3px)/-2);
transform:rotateY(calc(var(--p)*1deg)) translateZ(var(--ri)) rotateY(180deg);
background:linear-gradient(rgba(12,22,52,var(--k,0)),rgba(12,22,52,var(--k,0))),#d2d5dc}
/* borda inferior (espessura da faixa). A camera sempre olha de baixo do plano do anel, entao a borda de cima nunca aparece */
.anel .o::after,.anel .n::after{content:"";position:absolute;left:0;top:100%;width:100%;height:var(--e);background:#9da2ad;
backface-visibility:hidden;transform-origin:50% 0;transform:rotateX(-90deg)}
/* pontas (corte da faixa) */
.anel b{width:var(--e);margin-left:calc(var(--e)/-2);background:#dfe2e8}
.anel b.t{transform:rotateY(calc(var(--Ct)*1deg)) translateZ(calc(var(--ro) - var(--e)/2)) rotateY(-90deg)}
.anel b.l{transform:rotateY(calc(var(--Cl)*1deg)) translateZ(calc(var(--ro) - var(--e)/2)) rotateY(90deg)}
/* uma ponta so aparece na camada certa: frente se estiver do lado de la (cos>0), fundo se estiver atras */
.frente .anel b.t{opacity:clamp(0,calc(cos(calc(var(--Ct)*1deg))*1000),1)}
.frente .anel b.l{opacity:clamp(0,calc(cos(calc(var(--Cl)*1deg))*1000),1)}
.fundo .anel b.t{opacity:clamp(0,calc(cos(calc(var(--Ct)*1deg))*-1000),1)}
.fundo .anel b.l{opacity:clamp(0,calc(cos(calc(var(--Cl)*1deg))*-1000),1)}

/* sombra da faixa projetada sobre a esfera (fica dentro do recorte circular da esfera) */
.sombra{transform:translate(calc(var(--r)*.02),calc(var(--r)*.085));filter:blur(calc(var(--r)*.022));opacity:.62}
.sombra .anel .o{background:#001030}
.sombra .anel .o::after{display:none}
.sombra .anel .o{width:calc(2*var(--ro)*tan(2.5deg) + 3px);margin-left:calc((2*var(--ro)*tan(2.5deg) + 3px)/-2)}
